name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Run analysis assertions
        run: lake env lean Tests/AnalysisTest.lean
      - name: Run command fixture
        run: lake env lean Tests/Fixture.lean
